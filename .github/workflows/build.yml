name: Multi-Platform Release Build (Windows, macOS, Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller DragShift.spec --noconfirm

      - name: Build portable SuperDrag.exe
        run: pyinstaller DragShift.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Smoke-test both builds
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $appFolderExe = if (Test-Path "dist\SuperDrag\SuperDrag.exe") { "dist\SuperDrag\SuperDrag.exe" } else { "dist\DragShift\DragShift.exe" }
          $singleExe = if (Test-Path "dist\SuperDrag.exe") { "dist\SuperDrag.exe" } else { "dist\DragShift.exe" }
          foreach ($exe in @($appFolderExe, $singleExe)) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          "{0:N1} MB portable" -f ((Get-Item $singleExe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $iss = if (Test-Path "installer\SuperDrag.iss") { "installer\SuperDrag.iss" } else { "installer\DragShift.iss" }
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setupExe = if (Test-Path "dist\SuperDrag-Setup.exe") { "dist\SuperDrag-Setup.exe" } else { "dist\DragShift-Setup.exe" }
          "{0:N1} MB installer" -f ((Get-Item $setupExe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $setupExe = if (Test-Path "dist\SuperDrag-Setup.exe") { "dist\SuperDrag-Setup.exe" } else { "dist\DragShift-Setup.exe" }
          $p = Start-Process $setupExe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\SuperDrag\SuperDrag.exe"
          if (-not (Test-Path $app)) {
            $app = "$env:LOCALAPPDATA\Programs\DragShift\DragShift.exe"
          }
          if (-not (Test-Path $app)) { throw "App not installed: $app" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $unins = if (Test-Path "$env:LOCALAPPDATA\Programs\SuperDrag\unins000.exe") { "$env:LOCALAPPDATA\Programs\SuperDrag\unins000.exe" } else { "$env:LOCALAPPDATA\Programs\DragShift\unins000.exe" }
          $u = Start-Process $unins -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*Drag*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app bundle
        run: pyinstaller DragShift.spec --noconfirm

      - name: Self-test the app bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="dist/SuperDrag.app"
          if [ ! -d "$APP" ]; then APP="dist/DragShift.app"; fi
          "$APP/Contents/MacOS/"* --selftest
          codesign --verify --deep --verbose=2 "$APP" || true
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"

      - name: Sign & notarize the app (only when Apple credentials are configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No Apple Developer ID configured: shipping ad-hoc signed (users see Gatekeeper's warning)."
            exit 0
          fi
          APP="dist/SuperDrag.app"
          if [ ! -d "$APP" ]; then APP="dist/DragShift.app"; fi
          KC=build.keychain; KCPW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KCPW" $KC
          security import cert.p12 -k $KC -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" $KC
          # sign every nested binary first, then the bundle (hardened runtime + timestamp)
          find "$APP/Contents" -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "{}" || true
          codesign --force --deep --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" SuperDrag.zip
          xcrun notarytool submit SuperDrag.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: Make the .dmg (drag SuperDrag to Applications)
        run: |
          mkdir -p dmg
          APP="dist/SuperDrag.app"
          if [ ! -d "$APP" ]; then APP="dist/DragShift.app"; fi
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          DMG_OUT="dist/SuperDrag-mac-${{ matrix.arch }}.dmg"
          hdiutil create -volname "SuperDrag" -srcfolder dmg -ov -format UDZO "$DMG_OUT"
          du -h "$DMG_OUT"
          if [ "${SIGNED:-0}" = "1" ]; then
            codesign --force --timestamp --sign "${{ secrets.MACOS_SIGN_IDENTITY }}" "$DMG_OUT"
            xcrun notarytool submit "$DMG_OUT" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple "$DMG_OUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*Drag*-mac-${{ matrix.arch }}.dmg

  linux:
    # Built on Debian 12 (glibc 2.36): the .deb runs on Debian 12/13, Ubuntu 23.04+, Mint 22, MX 23…
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: System packages
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git ca-certificates python3 python3-venv python3-dev binutils dpkg-dev file \
            libx11-6 libxext6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libfreetype6 \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 \
            xvfb xfwm4 thunar xdotool dbus-x11 ffmpeg feh fonts-dejavu-core fonts-noto-core \
            desktop-file-utils hicolor-icon-theme xdg-utils

      - uses: actions/checkout@v4

      - name: Python environment
        run: |
          python3 -m venv /opt/uv && /opt/uv/bin/pip install -q uv
          /opt/uv/bin/uv python install 3.12
          /opt/uv/bin/uv venv -p 3.12 /opt/venv
          VIRTUAL_ENV=/opt/venv /opt/uv/bin/uv pip install -q -r requirements.txt pyinstaller pytest
          /opt/venv/bin/python --version

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /opt/venv/bin/python -m pytest -q

      - name: Build the app folder
        run: /opt/venv/bin/pyinstaller DragShift.spec --noconfirm

      - name: Build the .deb
        run: |
          PATH=/opt/venv/bin:$PATH packaging/linux/build-deb.sh 1.1.0
          DEB=$(ls dist/*-linux-amd64.deb | head -n 1)
          dpkg-deb --info "$DEB"
          desktop-file-validate packaging/linux/superdrag.desktop || true
          desktop-file-validate packaging/linux/dragshift.desktop || true

      - name: Install the .deb and self-test it
        env:
          QT_QPA_PLATFORM: offscreen
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          mkdir -p e2e_linux_out
          DEB="./dist/SuperDrag-linux-amd64.deb"
          if [ ! -f "$DEB" ]; then DEB="./dist/DragShift-linux-amd64.deb"; fi
          apt-get install -y -q "$DEB" 2>&1 | tail -5
          APP_BIN="/usr/bin/superdrag"
          if [ ! -x "$APP_BIN" ]; then APP_BIN="/usr/bin/dragshift"; fi
          test -x "$APP_BIN"
          set +e
          "$APP_BIN" --selftest > e2e_linux_out/selftest.txt 2>&1
          rc=$?
          set -e
          echo "exit code $rc" >> e2e_linux_out/selftest.txt
          cat ~/.local/share/SuperDrag/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          cat ~/.local/share/DragShift/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          if [ $rc -ne 0 ]; then
            /opt/venv/bin/python -X faulthandler -m dragshift --selftest >> e2e_linux_out/selftest.txt 2>&1 || true
            cat ~/.local/share/SuperDrag/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
            cat ~/.local/share/DragShift/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          fi
          cat e2e_linux_out/selftest.txt
          if [ $rc -ne 0 ]; then
            tail -25 e2e_linux_out/selftest.txt | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=selftest::$l"; done
            exit $rc
          fi

      - name: End-to-end on XFCE (Xvfb + xfwm4 with compositor off + Thunar)
        continue-on-error: true
        run: |
          export DISPLAY=:99 LANG=C.UTF-8 LC_ALL=C.UTF-8
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          eval $(dbus-launch --sh-syntax)
          /opt/venv/bin/python -c "from dragshift.imaging import gradient; gradient((1280, 800), ['#ffb36b', '#ff5f6d', '#c2508f', '#7b8cff'], 160).save('/tmp/wall.png')"
          xfwm4 --compositor=off >/tmp/xfwm4.log 2>&1 &
          sleep 2
          feh --no-fehbg --bg-fill /tmp/wall.png
          /opt/venv/bin/python demo/e2e_linux.py || { tail -15 e2e_linux_out/log.txt | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=e2e::$l"; done; exit 1; }

      - name: Summary
        if: always()
        run: cat e2e_linux_out/results.md >> $GITHUB_STEP_SUMMARY || true

      - name: Save results to the e2e-linux-output branch
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/o && cp -r e2e_linux_out/* /tmp/o/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan e2e-linux-output
          git rm -rfq . || true
          git clean -fdxq -e dist || true
          cp -r /tmp/o/* . || true
          echo "Run ${GITHUB_SHA}" > RUN.txt
          git add -A -- . ':!dist'
          git commit -qm "Debian/XFCE E2E results ${GITHUB_SHA}"
          git push -f origin e2e-linux-output || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb
          path: |
            dist/*Drag*-linux-amd64.deb

  publish:
    needs: [windows, macos, linux]
    if: always() && !cancelled() && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Inspect generated artifacts
        run: ls -la out

      - name: Upload assets to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Upload to release v1.1.0
          echo "Attaching assets to v1.1.0 release..."
          gh release upload v1.1.0 out/* --clobber || true

          # 2. Upload to latest release
          echo "Attaching assets to latest release..."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/* --clobber
          else
            gh release create latest out/* --title "SuperDrag (Latest Build)" --notes "Latest multi-platform builds of SuperDrag (Windows, macOS, Linux)"
          fi
